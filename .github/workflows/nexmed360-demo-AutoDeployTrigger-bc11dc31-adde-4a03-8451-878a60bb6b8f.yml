name: Trigger auto deployment for nexmed360-demo

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ develop ]
    paths:
    - '**'
    - '.github/workflows/nexmed360-demo-AutoDeployTrigger-bc11dc31-adde-4a03-8451-878a60bb6b8f.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.NEXMED360DEMO_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.NEXMED360DEMO_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.NEXMED360DEMO_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.NEXMED360DEMO_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.NEXMED360DEMO_REGISTRY_PASSWORD }}
          containerAppName: nexmed360-demo
          resourceGroup: hhims-cicd-demo
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


